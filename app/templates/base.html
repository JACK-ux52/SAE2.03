<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
    </head>
    <body class="container">
        <nav class="navbar">
            {% if session.get("utilisateur_id") %}
                <a href="{{ url_for('accueil') }}">
                    <button type="button" class="btn btn-primary">Aller à l'accueil</button>
                </a>
                <a href="{{ url_for('inventaire') }}">
                    <button type="button" class="btn btn-primary">Voir l'inventaire</button>
                </a>
                <a href="{{ url_for('carte') }}">
                    <button type="button" class="btn btn-primary">Voir la carte</button>
                </a>
                <a href="{{ url_for('deconnexion') }}">
                    <button type="button" class="btn btn-danger">Se déconnecter</button>
                </a>
            {% endif %}
        </nav>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        {% block content %}
        {% endblock %}
    </body>
</html>
