{% extends "base.html" %}
{% block title %}{{ bouton }} un Équipement - SAE23{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card">
            <h2 class="text-center mb-4" style="background: linear-gradient(to right, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">
                {{ bouton }} un Équipement
            </h2>

            <form action="{{ action }}" method="post">
                <!-- Nom -->
                <div class="mb-3">
                    <label for="nom" class="form-label">Nom de l'équipement</label>
                    <input type="text" class="form-control" id="nom" name="nom" value="{{ equipement.nom if equipement else '' }}" placeholder="Ex: Switch-Core-01" required />
                </div>

                <div class="row">
                    <!-- Type d'équipement -->
                    <div class="col-md-6 mb-3">
                        <label for="type_equipement" class="form-label">Type d'équipement</label>
                        <select name="type_equipement" id="type_equipement" class="form-select text-white" style="background-color: var(--bg-main);" required>
                            <option value="">-- Choisir un type --</option>
                            <option value="Switch" {% if equipement and equipement.type_equipement == 'Switch' %}selected{% endif %}>Switch/Commutateur</option>
                            <option value="Routeur" {% if equipement and equipement.type_equipement == 'Routeur' %}selected{% endif %}>Routeur</option>
                            <option value="PC" {% if equipement and equipement.type_equipement == 'PC' %}selected{% endif %}>PC</option>
                            <option value="Imprimantes" {% if equipement and equipement.type_equipement == 'Imprimantes' %}selected{% endif %}>Imprimantes</option>
                            <option value="Téléphones" {% if equipement and equipement.type_equipement == 'Téléphones' %}selected{% endif %}>Téléphones</option>
                        </select>
                    </div>

                    <!-- Marque -->
                    <div class="col-md-6 mb-3">
                        <label for="marque" class="form-label">Marque</label>
                        <select name="marque" id="marque" class="form-select text-white" style="background-color: var(--bg-main);" required>
                            <option value="">-- Choisir une marque --</option>
                            <option value="Cisco" {% if equipement and equipement.marque == 'Cisco' %}selected{% endif %}>Cisco</option>
                            <option value="Stormshield" {% if equipement and equipement.marque == 'Stormshield' %}selected{% endif %}>Stormshield</option>
                            <option value="HP" {% if equipement and equipement.marque == 'HP' %}selected{% endif %}>HP</option>
                            <option value="Fanvill" {% if equipement and equipement.marque == 'Fanvill' %}selected{% endif %}>Fanvill</option>
                        </select>
                    </div>
                </div>

                <!-- Adresse IP -->
                <div class="mb-3">
                    <label for="adresse_ip" class="form-label">Adresse IP (Optionnelle)</label>
                    <input type="text" class="form-control font-monospace text-info" id="adresse_ip" name="adresse_ip" value="{{ equipement.adresse_ip if equipement else '' }}" placeholder="Ex: 192.168.1.254" />
                </div>

                <div class="row">
                    <!-- Localisation -->
                    <div class="col-md-6 mb-3">
                        <label for="localisation" class="form-label">Localisation</label>
                        <select name="localisation" id="localisation" class="form-select text-white" style="background-color: var(--bg-main);" required>
                            <option value="">-- Choisir un lieu --</option>
                            <option value="H0-05" {% if equipement and equipement.localisation == 'H0-05' %}selected{% endif %}>H0-05</option>
                            <option value="H1-11" {% if equipement and equipement.localisation == 'H1-11' %}selected{% endif %}>H1-11</option>
                            <option value="J0-01" {% if equipement and equipement.localisation == 'J0-01' %}selected{% endif %}>J0-01</option>
                            <option value="J0-09" {% if equipement and equipement.localisation == 'J0-09' %}selected{% endif %}>J0-09</option>
                            <option value="J0-04" {% if equipement and equipement.localisation == 'J0-04' %}selected{% endif %}>J0-04</option>
                            <option value="I0-02" {% if equipement and equipement.localisation == 'I0-02' %}selected{% endif %}>I0-02</option>
                            <option value="Réserve" {% if equipement and equipement.localisation == 'Réserve' %}selected{% endif %}>Réserve</option>
                        </select>
                    </div>

                    <!-- Statut -->
                    <div class="col-md-6 mb-4">
                        <label for="statut" class="form-label">Statut</label>
                        <select name="statut" id="statut" class="form-select text-white" style="background-color: var(--bg-main);" required>
                            <option value="">-- Choisir un statut --</option>
                            <option value="En marche" {% if equipement and equipement.statut == 'En marche' %}selected{% endif %}>En marche</option>
                            <option value="A l'arrêt" {% if equipement and equipement.statut == "A l'arrêt" %}selected{% endif %}>A l'arrêt</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-premium py-2 fw-bold">{{ bouton }} l'équipement</button>
                    <a href="{{ url_for('inventaire') }}" class="btn btn-premium-secondary py-2">
                        Annuler et retourner à l'inventaire
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
