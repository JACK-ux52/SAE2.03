{% extends "base.html" %}
{% block title %}Connexion - SAE23{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card">
            <h2 class="text-center mb-4" style="background: linear-gradient(to right, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">Connexion</h2>
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="nom" class="form-label">Nom d'utilisateur</label>
                    <input type="text" class="form-control" id="nom" name="nom" placeholder="Votre nom" required/>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Votre mot de passe" required/>
                </div>
                <button type="submit" class="btn btn-premium w-100 mb-3">Se connecter</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('nouvel_utilisateur') }}" class="text-info text-decoration-none small">Pas encore inscrit ? Créer un compte</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
